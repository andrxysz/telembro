[package]
name = "telembro"
version = "0.1.2"
description = "Um lembrete gentil. Um dia mais leve."
authors = ["Telembro"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "telembro_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = false

